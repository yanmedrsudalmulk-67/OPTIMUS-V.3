name: medical-tug-local
services:
  database:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: medical
      POSTGRES_DB: medical
      POSTGRES_PASSWORD: ${LOCAL_DB_PASSWORD:?Use the launcher first}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U medical -d medical']
      interval: 3s
      timeout: 3s
      retries: 30
  game:
    build:
      context: .
      dockerfile: Dockerfile.local
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://medical:${LOCAL_DB_PASSWORD}@database:5432/medical?schema=public
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: ${LOCAL_ADMIN_PASSWORD:?Use the launcher first}
      API_PORT: '4001'
      WEB_ORIGIN: http://localhost:3000,http://127.0.0.1:3000
      COOKIE_SECURE: 'false'
    ports:
      - '127.0.0.1:${LOCAL_PORT:-3000}:3000'
    volumes:
      - uploads:/app/apps/realtime-server/uploads
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s
volumes:
  database:
  uploads:
